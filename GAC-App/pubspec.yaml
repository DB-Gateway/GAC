name: gac_flutter
description: "Flutter conversion of the GAC welcome and authentication screens."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image_picker: ^1.2.1
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  web: ^1.1.1
  workmanager: ^0.10.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: EurostileExtendedBlack
      fonts:
        - asset: assets/fonts/EurostileExtendedBlack.ttf
          weight: 900
  assets:
    - assets/images/Gateway_logo_circle.png
    - assets/images/G-logo-no-bg.png
    - assets/images/no-bg-gateway-logo.png
