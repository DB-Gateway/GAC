workflows:
  gac_ios_simulator_debug:
    name: GAC iOS Simulator Debug
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Boot an iPhone simulator and run GAC
        script: |
          cd "$CM_BUILD_DIR/GAC-App"

          flutter pub get

          SIMULATOR_ID="$(python3 - <<'PY'
          import json
          import subprocess

          result = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              text=True,
          )
          data = json.loads(result)
          iphones = [
              device
              for runtime, devices in data["devices"].items()
              if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
              for device in devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not iphones:
              raise SystemExit("No available iPhone simulator was found on this Mac.")

          device = next((item for item in iphones if item.get("state") == "Booted"), iphones[0])
          print(device["udid"])
          PY
          )"

          echo "Starting GAC on simulator $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          open -a Simulator
          flutter run -d "$SIMULATOR_ID"
